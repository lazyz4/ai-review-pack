services:
  ai-review-pack:
    build: .
    image: ai-review-pack
    container_name: ai-review-pack
    restart: unless-stopped
    ports:
      - "80:8000"
    environment:
      - MY_DEEPSEEK_KEY=${MY_DEEPSEEK_KEY:?请在 .env 中配置 MY_DEEPSEEK_KEY}
      - DEMO_USERNAME=${DEMO_USERNAME:-demo}
      - DEMO_PASSWORD=${DEMO_PASSWORD:?请在 .env 中配置 DEMO_PASSWORD}
    volumes:
      - ./data:/app/backend/data
