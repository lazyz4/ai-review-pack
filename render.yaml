services:
  - type: web
    name: ai-review-pack
    runtime: docker
    repo: https://github.com/lazyz4/ai-review-pack
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    envVars:
      - key: MY_DEEPSEEK_KEY
        sync: false
      - key: DEMO_USERNAME
        value: demo
      - key: DEMO_PASSWORD
        sync: false
      - key: DATABASE_PATH
        value: /app/backend/data/users.db
